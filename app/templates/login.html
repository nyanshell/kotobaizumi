{% extends "base.html" %}

{% block page_title %}Login - 言葉の泉{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm">
        <div class="text-center border-b border-slate-100 pb-6 mb-8">
            <h2 class="text-3xl font-bold text-slate-800 mb-2">言葉の泉</h2>
            <p class="text-slate-600">Japanese Language Learning Platform</p>
        </div>

        <form method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username:</label>
                <input type="text" id="username" name="username" required 
                       class="w-full px-4 py-3 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" 
                       placeholder="Enter your username">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password:</label>
                <input type="password" id="password" name="password" required 
                       class="w-full px-4 py-3 border border-slate-300 rounded-lg text-base focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" 
                       placeholder="Enter your password">
            </div>
            
            <button type="submit" class="w-full btn-primary px-4 py-3 text-white rounded-lg font-medium mt-6">Login</button>
        </form>
        
        <div class="mt-8 p-4 bg-blue-50 border border-blue-200 rounded-lg border-l-4 border-l-blue-500 text-center">
            <p class="text-sm text-blue-800 mb-0">
                Contact your administrator to create an account
            </p>
        </div>
    </div>
</div>

<div class="mt-12 text-center">
    <div class="flex justify-center items-center gap-8 flex-wrap text-slate-500 text-sm">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
            </svg>
            Learn Japanese
        </span>
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v9.114A4.369 4.369 0 005 14c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V7.82l8-1.6v5.894A4.369 4.369 0 0015 12c-1.657 0-3 .895-3 2s1.343 2 3 2 3-.895 3-2V3z"/>
            </svg>
            Audio Practice
        </span>
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Spaced Repetition
        </span>
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
            </svg>
            AI Translations
        </span>
    </div>
</div>
{% endblock %}
