{% extends "base.html" %}

{% block content %}
<!-- Tab Navigation -->
<div class="mb-8">
    <div class="border-b border-slate-200">
        <nav class="flex space-x-8">
            <button class="tab-button py-3 px-6 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-800 hover:border-slate-300 transition-colors ui-active:border-primary-500 ui-active:text-primary-600" data-tab="review">Due for Review</button>
            <button class="tab-button py-3 px-6 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-800 hover:border-slate-300 transition-colors" data-tab="random">Random Practice</button>
            <button class="tab-button py-3 px-6 text-sm font-medium border-b-2 border-transparent text-slate-600 hover:text-slate-800 hover:border-slate-300 transition-colors" data-tab="all">All Sentences</button>
        </nav>
    </div>

    <!-- Review Tab -->
    <div id="review-tab" class="tab-content pt-6 block">
        <div class="bg-slate-50 rounded-xl p-6 mb-6 border border-slate-200">
            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                    <div class="flex items-center gap-3">
                        <label for="review-count" class="text-sm font-medium text-slate-700">Number of sentences:</label>
                        <input type="number" id="review-count" class="w-20 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" min="1" max="50" value="10">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadSentences('review')" class="btn-primary px-4 py-2 text-white rounded-lg font-medium text-sm">Load</button>
                        <button onclick="loadPreviousPage('review')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Previous</button>
                        <button onclick="loadNextPage('review')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Next</button>
                    </div>
                </div>
                <a href="{{ url_for('generate') }}" class="btn-success px-4 py-2 text-white rounded-lg font-medium text-sm">Add New Sentence</a>
            </div>
        </div>
        <div id="review-content"></div>
    </div>

    <!-- Random Tab -->
    <div id="random-tab" class="tab-content pt-6 hidden">
        <div class="bg-slate-50 rounded-xl p-6 mb-6 border border-slate-200">
            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                    <div class="flex items-center gap-3">
                        <label for="random-count" class="text-sm font-medium text-slate-700">Number of sentences:</label>
                        <input type="number" id="random-count" class="w-20 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" min="1" max="10" value="1">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadSentences('random')" class="btn-primary px-4 py-2 text-white rounded-lg font-medium text-sm">Load</button>
                        <button onclick="loadPreviousPage('random')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Previous</button>
                        <button onclick="loadNextPage('random')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Next</button>
                    </div>
                </div>
                <a href="{{ url_for('generate') }}" class="btn-success px-4 py-2 text-white rounded-lg font-medium text-sm">Add New Sentence</a>
            </div>
        </div>
        <div id="random-content"></div>
    </div>

    <!-- All Sentences Tab -->
    <div id="all-tab" class="tab-content pt-6 hidden">
        <div class="bg-slate-50 rounded-xl p-6 mb-6 border border-slate-200">
            <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
                <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                    <div class="flex items-center gap-3">
                        <label for="all-count" class="text-sm font-medium text-slate-700">Number of sentences:</label>
                        <input type="number" id="all-count" class="w-20 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent" min="1" max="50" value="10">
                    </div>
                    <div class="flex gap-3">
                        <button onclick="loadSentences('all')" class="btn-primary px-4 py-2 text-white rounded-lg font-medium text-sm">Load</button>
                        <button onclick="loadPreviousPage('all')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Previous</button>
                        <button onclick="loadNextPage('all')" class="px-4 py-2 text-slate-600 bg-white border border-slate-300 rounded-lg font-medium text-sm hover:bg-slate-50 transition-colors">Next</button>
                    </div>
                </div>
                <a href="{{ url_for('generate') }}" class="btn-success px-4 py-2 text-white rounded-lg font-medium text-sm">Add New Sentence</a>
            </div>
        </div>
        <div id="all-content"></div>
    </div>
</div>

<!-- Tab and Audio Management -->
<script>
let currentTab = 'review';
let currentAudio = null;

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const sortType = urlParams.get('sort') || 'review';
    const count = urlParams.get('count') || getDefaultCount(sortType);

    // Set the active tab without causing any requests
    currentTab = sortType;
    setActiveTab(sortType);

    // Set the count input value
    const countInput = document.getElementById(sortType + '-count');
    if (countInput) {
        countInput.value = count;
    }

    // Render sentence cards
    const sentenceData = {{ data|tojson|safe }};
    const container = document.getElementById('initial-content');

    if (!sentenceData || sentenceData.length === 0) {
        container.innerHTML = `
            <div class="text-center py-16">
                <div class="max-w-md mx-auto">
                    <h3 class="text-xl font-medium text-slate-700 mb-4">No sentences available</h3>
                    <p class="text-slate-500 mb-6">Get started by adding your first sentence!</p>
                    <a href="{{ url_for('generate') }}" class="btn-primary px-6 py-3 text-white rounded-lg font-medium">Add New Sentence</a>
                </div>
            </div>
        `;
    } else {
        const showReview = sortType === 'review';
        sentenceData.forEach(item => {
            const card = createSentenceCard(item, showReview);
            container.appendChild(card);
        });
    }

    // Move initial content to the active tab
    moveInitialContentToActiveTab();
});

function getDefaultCount(tabType) {
    switch(tabType) {
        case 'review': return 10;
        case 'random': return 1;
        case 'all': return 10;
        default: return 10;
    }
}

function setActiveTab(tabName) {
    // Remove active classes from all tabs and content
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('border-primary-500', 'text-primary-600');
        btn.classList.add('border-transparent', 'text-slate-600');
    });
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
        content.classList.remove('block');
    });

    // Add active class to selected tab
    const tabButton = document.querySelector(`[data-tab="${tabName}"]`);
    if (tabButton) {
        tabButton.classList.remove('border-transparent', 'text-slate-600');
        tabButton.classList.add('border-primary-500', 'text-primary-600');
    }

    const tabContent = document.getElementById(tabName + '-tab');
    if (tabContent) {
        tabContent.classList.remove('hidden');
        tabContent.classList.add('block');
    }

    currentTab = tabName;
}

function switchTab(tabName) {
    // If switching to a different tab, load the sentences
    if (tabName !== currentTab) {
        const count = document.getElementById(tabName + '-count').value;
        window.location.href = `/?sort=${tabName}&count=${count}`;
    }
}

// Add click handlers for tab buttons
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', function() {
            const tabName = this.getAttribute('data-tab');
            switchTab(tabName);
        });
    });
});

function loadSentences(tabType) {
    const count = document.getElementById(tabType + '-count').value;
    // Simple redirect - no AJAX to avoid infinite loops
    window.location.href = `/?sort=${tabType}&count=${count}`;
}

function loadPreviousPage(tabType) {
    const urlParams = new URLSearchParams(window.location.search);
    const currentPage = parseInt(urlParams.get('page') || '1');
    const count = document.getElementById(tabType + '-count').value;

    if (currentPage > 1) {
        window.location.href = `/?sort=${tabType}&count=${count}&page=${currentPage - 1}`;
    }
}

function loadNextPage(tabType) {
    const urlParams = new URLSearchParams(window.location.search);
    const currentPage = parseInt(urlParams.get('page') || '1');
    const count = document.getElementById(tabType + '-count').value;

    window.location.href = `/?sort=${tabType}&count=${count}&page=${currentPage + 1}`;
}

function moveInitialContentToActiveTab() {
    setTimeout(() => {
        const initialContent = document.getElementById('initial-content');
        const activeContainer = document.getElementById(currentTab + '-content');

        if (initialContent && activeContainer) {
            // Move the content to the active tab
            activeContainer.innerHTML = initialContent.innerHTML;
            initialContent.style.display = 'none';
            // Load audio stats and combined audio for the moved content
            loadAllAudioStats();
            loadAllCombinedAudio();
            loadAllGrammarExplanations();
        }
    }, 100);
}

function highlightGrammarPatterns(text) {
    // Replace {{pattern}} with highlighted spans
    const pattern = new RegExp('\\{\\{([^}]+)\\}\\}', 'g');
    return text.replace(pattern, '<span class="bg-green-200 text-green-800 px-1 py-0.5 rounded font-medium">$1</span>');
}

function toggleGrammarExplanation(hash) {
    const explanationDiv = document.getElementById(`grammar-explanation-${hash}`);
    const toggleButton = document.getElementById(`grammar-toggle-${hash}`);

    if (explanationDiv.classList.contains('hidden')) {
        explanationDiv.classList.remove('hidden');
        toggleButton.textContent = 'Hide Grammar Details';
        toggleButton.classList.remove('bg-blue-500', 'hover:bg-blue-600');
        toggleButton.classList.add('bg-gray-500', 'hover:bg-gray-600');
    } else {
        explanationDiv.classList.add('hidden');
        toggleButton.textContent = 'Show Grammar Details';
        toggleButton.classList.remove('bg-gray-500', 'hover:bg-gray-600');
        toggleButton.classList.add('bg-blue-500', 'hover:bg-blue-600');
    }
}

function createSentenceCard(item, showReview = false) {
    const card = document.createElement('div');
    card.className = 'bg-white border border-slate-200 rounded-xl p-6 mb-6 shadow-sm hover:shadow-md transition-shadow';

    const textToHighlight = item.rendered_text || item.ja_text;
    const highlightedJaText = highlightGrammarPatterns(textToHighlight);

    card.innerHTML = `
        <div class="border-b border-slate-100 pb-4 mb-4">
            <div class="text-japanese text-slate-800 mb-2">${highlightedJaText}</div>
            <div class="text-reading">${item.reading}</div>
        </div>

        <div class="mb-4">
            <div class="text-sm font-medium text-slate-700 mb-2">Translations:</div>
            <ul class="space-y-1 text-sm text-slate-600">
                <li>English: ${item.en_text}</li>
                <li>Chinese: ${item.cn_text}</li>
                <li class="text-xs text-slate-400">ID: ${item.hash}</li>
            </ul>
        </div>

        ${item.last_played || item.play_count ? `
        <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-lg">
            <div class="text-sm font-medium text-blue-800 mb-1">Playback Stats:</div>
            <div class="text-xs text-blue-600">
                ${item.play_count ? `Played ${item.play_count} times` : 'Not played yet'}
                ${item.last_played ? ` • Last played: ${new Date(item.last_played).toLocaleDateString()}` : ''}
            </div>
        </div>
        ` : ''}

        ${item.explanation ? `
        <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-4">
            <h3 class="text-green-800 font-medium mb-3">Combined Audio Playback</h3>
            <audio controls class="w-full" id="combined-audio-${item.hash}">
                <source src="" type="audio/wav">
            </audio>
        </div>
        <div class="mb-4">
            <button id="grammar-toggle-${item.hash}" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition-colors" onclick="toggleGrammarExplanation('${item.hash}')">Show Grammar Details</button>
            <div id="grammar-explanation-${item.hash}" class="hidden mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                ${item.grammar ? `<div class="mb-3"><span class="text-blue-800 font-medium">Grammar Pattern:</span> <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded font-mono text-sm">${item.grammar}</span></div>` : ''}
                <h4 class="text-blue-800 font-medium mb-2">Grammar Explanation:</h4>
                <div class="prose prose-sm max-w-none text-blue-700"></div>
            </div>
        </div>
        ` : ''}

        ${item.available_voices && item.available_voices.length > 0 ? `
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
            <div class="text-sm font-medium text-slate-700 mb-3">Play Individual Voices:</div>
            <div class="flex flex-wrap gap-2 mb-3">
                ${item.available_voices.map(voice => {
                    const colorClasses = {
                        'green': 'bg-green-500 hover:bg-green-600',
                        'blue': 'bg-blue-500 hover:bg-blue-600',
                        'red': 'bg-red-500 hover:bg-red-600',
                        'purple': 'bg-purple-500 hover:bg-purple-600',
                        'gray': 'bg-gray-500 hover:bg-gray-600'
                    };
                    const btnClass = colorClasses[voice.color] || colorClasses['gray'];
                    return `<button class="px-3 py-1.5 ${btnClass} text-white text-xs font-medium rounded-md transition-colors" onclick="playVoice('${item.hash}', '${voice.name}')">${voice.display_name}</button>`;
                }).join('')}
            </div>
            <div id="audio-stats-${item.hash}" class="text-xs text-slate-500"></div>
        </div>
        ` : `
        <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
            <div class="text-sm font-medium text-yellow-800">No audio files available for this sentence.</div>
        </div>
        `}


        <div class="border-t border-slate-100 pt-4">
            <button class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white text-sm font-medium rounded-lg transition-colors" onclick="deleteSentence('${item.hash}')">Delete</button>
        </div>
    `;

    // Load audio stats for this sentence
    setTimeout(() => {
        loadAudioStats(item.hash);
        if (item.explanation) {
            loadCombinedAudio(item.hash);
            // Load grammar explanation
            loadGrammarExplanation(item.hash, item.explanation);
        }
    }, 100);

    return card;
}

function submitReview(sentenceId, quality) {
    fetch(`/review/${sentenceId}/${quality}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.result === 'success') {
            // Show success message and reload page
            showMessage('Review submitted successfully!', 'success');
            setTimeout(() => window.location.reload(), 1000);
        } else {
            showMessage('Error submitting review', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showMessage('Error submitting review', 'error');
    });
}

function deleteSentence(hash) {
    if (confirm('Are you sure you want to delete this sentence?')) {
        fetch(`/delete/${hash}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'done!') {
                showMessage('Sentence deleted successfully!', 'success');
                setTimeout(() => window.location.reload(), 1000);
            } else {
                showMessage('Error deleting sentence', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('Error deleting sentence', 'error');
        });
    }
}

function playVoice(hash, voiceName) {
    // Stop current audio if playing
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }

    fetch(`/audio/${hash}/${voiceName}`)
        .then(response => response.json())
        .then(data => {
            if (data.audio) {
                currentAudio = new Audio(data.audio);
                currentAudio.play().catch(error => {
                    console.error('Error playing audio:', error);
                    showMessage('Error playing audio', 'error');
                });
                // Refresh audio stats after playing
                setTimeout(() => loadAudioStats(hash), 500);
            } else {
                showMessage('Audio not available', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('Error loading audio', 'error');
        });
}

function loadAudioStats(hash) {
    fetch(`/audio-stats/${hash}`)
        .then(response => response.json())
        .then(data => {
            if (data.stats) {
                displayAudioStats(hash, data.stats);
            }
        })
        .catch(error => {
            console.error('Error loading audio stats:', error);
        });
}

function displayAudioStats(hash, stats) {
    const container = document.getElementById(`audio-stats-${hash}`);
    if (!container) return;

    if (Object.keys(stats).length === 0) {
        container.innerHTML = '';
        return;
    }

    const voiceNames = {
        'Leda': 'Leda (JP)',
        'Zephyr': 'Zephyr (Slow JP)',
        'ja-JP-AoiNeural': 'Aoi',
        'ja-JP-MayuNeural': 'Mayu',
        'ja-JP-DaichiNeural': 'Daichi',
        'en': 'English',
        'zh': 'Chinese'
    };

    let html = '<div class="text-xs text-slate-500 mt-2"><strong>Play Stats:</strong><br>';

    for (const [voice, stat] of Object.entries(stats)) {
        const displayName = voiceNames[voice] || voice;
        const lastPlayed = new Date(stat.last_played).toLocaleDateString();
        html += `${displayName}: ${stat.play_count} plays (last: ${lastPlayed})<br>`;
    }

    html += '</div>';
    container.innerHTML = html;
}

function loadAllAudioStats() {
    // Load stats for all visible sentences
    document.querySelectorAll('[id^="audio-stats-"]').forEach(element => {
        const hash = element.id.replace('audio-stats-', '');
        loadAudioStats(hash);
    });
}

function loadCombinedAudio(hash) {
    // Load combined audio for sentences with grammar explanations
    const audioElement = document.getElementById(`combined-audio-${hash}`);
    if (audioElement) {
        // Add event listener to track when combined audio is played
        audioElement.addEventListener('play', function() {
            fetch(`/track-combined-audio/${hash}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.result === 'success') {
                    // Refresh audio stats after playing
                    setTimeout(() => loadAudioStats(hash), 500);
                }
            })
            .catch(error => {
                console.error('Error tracking combined audio play:', error);
            });
        });

        // Load the combined audio source
        fetch(`/combined-audio/${hash}`)
            .then(response => response.json())
            .then(data => {
                if (data.audio) {
                    audioElement.src = data.audio;
                }
            })
            .catch(error => {
                console.error('Error loading combined audio:', error);
            });
    }
}

function loadGrammarExplanation(hash, explanation) {
    const explanationDiv = document.querySelector(`#grammar-explanation-${hash} .prose`);
    if (explanationDiv && explanation) {
        explanationDiv.innerHTML = marked.parse(explanation);
    }
}

function loadAllCombinedAudio() {
    // Load combined audio for all sentences with explanations
    document.querySelectorAll('[id^="combined-audio-"]').forEach(element => {
        const hash = element.id.replace('combined-audio-', '');
        loadCombinedAudio(hash);
    });
}

function loadAllGrammarExplanations() {
    // Render markdown for all grammar explanations
    document.querySelectorAll('[id^="grammar-explanation-"]').forEach(explanationDiv => {
        const explanation = explanationDiv.getAttribute('data-explanation');
        const proseDiv = explanationDiv.querySelector('.prose');
        if (explanation && proseDiv) {
            proseDiv.innerHTML = marked.parse(explanation);
        }
    });
}

function showMessage(message, type) {
    // Create temporary message element
    const messageDiv = document.createElement('div');
    messageDiv.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
    messageDiv.style.position = 'fixed';
    messageDiv.style.top = '20px';
    messageDiv.style.right = '20px';
    messageDiv.style.zIndex = '1000';
    messageDiv.style.maxWidth = '300px';
    messageDiv.textContent = message;

    document.body.appendChild(messageDiv);

    // Remove after 3 seconds
    setTimeout(() => {
        if (messageDiv.parentNode) {
            messageDiv.parentNode.removeChild(messageDiv);
        }
    }, 3000);
}
</script>


<div id="initial-content">
</div>
{% endblock %}
